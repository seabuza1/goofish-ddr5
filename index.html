<style>

.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}

.sheet.open{transform:none}.sh-h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}.sh-h b{flex:1}.grab{width:40px;height:5px;border-radius:3px;background:var(--bd);margin:8px auto 0}
.sh-b{overflow-y:auto;padding:6px 14px 14px;overscroll-behavior:contain}.grp{margin:12px 0}.grp>div:first-child{font-size:12px;color:var(--mut);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}.grp .chips{display:flex;flex-wrap:wrap;gap:6px}
input[type=range]{width:100%;accent-color:var(--acc);height:32px}

@media(min-width:760px){
 .kpis{grid-template-columns:repeat(5,1fr)}.kpi.hl{grid-column:auto}.prio{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

</style></head><body>
<a class="skip" href="#list">Pular para os anúncios</a><div class="top"><div class="tr1"><h1>Memória DDR5 no Goofish</h1><button class="ib" id="theme" aria-label="Alternar tema claro/escuro"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button></div>

<script>
const $=s=>document.querySelector(s),brl=n=>n==null?"—":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}),cny=n=>n==null?"—":"¥"+n.toLocaleString("pt-BR");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GROUPS=[["marca","Marca"],["capacidade_gb","Capacidade",v=>v&&v!="null"?v+"GB":"?"],["kit","Kit"],["velocidade","Velocidade",v=>v&&v!="null"?v+" MHz":"?"],["cl","Latência (CL)",v=>v&&v!="null"?"CL"+v:"?"],["caixa_n","Caixa"],["rgb","RGB"],["envio","Envio"],["vend_risco","Risco do vendedor"],["status","Status"]];
const PAGE=20,isMobile=()=>innerWidth<760;
let D=[],META={},PMAX=0,S={f:{},q:"",sort:"preco",view:"cards",pmax:null,nv:false},shown=PAGE,charts={},bestIds=new Set();
const saved=localStorage.getItem("theme");if(saved)document.documentElement.dataset.theme=saved;
$("#theme").onclick=()=>{const t=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("theme",t);if($("#accCharts").open)drawCharts()};
function readHash(){try{const h=decodeURIComponent(location.hash.slice(1));if(h)Object.assign(S,JSON.parse(h))}catch(e){}}
function writeHash(){history.replaceState(null,"","#"+encodeURIComponent(JSON.stringify(S)))}
function countUp(el,to,fmt){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0)}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{META=d;D=d.items;init()}).catch(e=>{$("#meta").textContent="Falha ao carregar os dados: "+e});
const fmtOf=k=>(GROUPS.find(g=>g[0]==k)||[])[2]||(v=>v);
function openSheet(o){$("#sheet").classList.toggle("open",o);$("#scrim").classList.toggle("open",o);document.body.style.overflow=o?"hidden":""}
function init(){
 $("#meta").textContent=`Atualizado em ${META.gerado_em}. Mostra só anúncios que enviam e ainda estão à venda; ocultamos ${META.removidos_vendidos||0} vendidos, ${META.removidos_so_retirada||0} só para retirada e ${META.removidos_bloqueados||0} de vendedores bloqueados. Valores em reais convertidos a ¥1 = R$ ${META.taxa_cny_brl.toFixed(4)}, sem imposto nem frete.`;
 const g={};D.forEach(i=>{if(i.status!="à venda"||!i.preco_yuan)return;const k=i.velocidade+"|"+i.kit;if(!g[k]||i.preco_yuan<g[k].preco_yuan)g[k]=i});Object.values(g).forEach(i=>bestIds.add(i.id));
 const pr=D.map(i=>i.preco_brl).filter(Boolean);PMAX=Math.ceil(Math.max(...pr)/10)*10;
 Object.assign($("#pmax"),{min:Math.floor(Math.min(...pr)/10)*10,max:PMAX,step:10});
 readHash();if(!S.pmax)S.pmax=PMAX;if(isMobile()&&!location.hash)S.view="cards";
 $("#chips").innerHTML=GROUPS.map(([k,l,fm])=>{const vals=[...new Set(D.map(i=>String(i[k])))].sort((a,b)=>isNaN(a)||isNaN(b)?a.localeCompare(b):a-b);return `<div class="grp"><div>${l}</div><div class="chips">${vals.map(v=>`<button class="chip" data-k="${k}" data-v="${esc(v)}">${esc(fm?fm(v):v)} <small>${D.filter(i=>String(i[k])==v).length}</small></button>`).join("")}</div></div>`}).join("");
 $("#chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;toggle(c.dataset.k,c.dataset.v)};
 $("#active").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;if(c.dataset.k=="prio")S.prio=null;else if(c.dataset.k=="nv")S.nv=false;else if(c.dataset.k=="pmax")S.pmax=PMAX;else if(c.dataset.k=="q")S.q="";else toggle(c.dataset.k,c.dataset.v);render()};
 $("#nv").onchange=e=>{S.nv=e.target.checked;shown=PAGE;render(true);drawPrio()};
 let qt;$("#q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;shown=PAGE;render()},150)};
 $("#sort").onchange=e=>{S.sort=e.target.value;shown=PAGE;render()};
 $("#pmax").oninput=e=>{S.pmax=+e.target.value;render(true)};
 $("#vCards").onclick=()=>{S.view="cards";render()};$("#vTable").onclick=()=>{S.view="table";render()};
 $("#openF").onclick=()=>openSheet(true);$("#closeF").onclick=$("#scrim").onclick=$("#apply").onclick=()=>{openSheet(false);render()};
 $("#clear").onclick=()=>{S={f:{},q:"",sort:S.sort,view:S.view,pmax:PMAX,nv:false,prio:null};shown=PAGE;render(true)};
 addEventListener("keydown",e=>{if(e.key=="Escape")openSheet(false)});
 window.onhashchange=()=>{readHash();render()};
 const fab=$("#fab");addEventListener("scroll",()=>fab.classList.toggle("show",scrollY>600),{passive:true});fab.onclick=()=>scrollTo({top:0,behavior:"smooth"});
 $("#accCharts").ontoggle=()=>{if($("#accCharts").open)drawCharts()};
 const ps=D.map(i=>i.preco_yuan).filter(x=>x).sort((a,b)=>a-b),r=META.taxa_cny_brl,avg=ps.reduce((a,b)=>a+b,0)/ps.length,med=META.mediana;
 const V=D.filter(i=>i.verificado),best=V.filter(i=>i.vend_risco!="alto risco"&&i.status=="à venda").sort((a,b)=>a.preco_yuan-b.preco_yuan)[0];
 const K=[["Verificados",V.length,`de ${D.length} anúncios, últimas 12 h`],["À venda",D.filter(i=>i.status=="à venda").length,"no catálogo publicado"],["Descartados",(META.descartados||[]).length,"vendidos, por pente, duplicados…"],["Mediana",brl(med*r),cny(med)]];
 $("#cards").innerHTML=K.map(k=>`<div class="kpi"><small>${k[0]}</small><b>${k[1]}</b><small>${k[2]}</small></div>`).join("")+(best?`<div class="kpi hl" id="bestk" role="button" tabindex="0"><small>Melhor oferta verificada</small><b>${brl(best.preco_brl)}</b><small>${esc(nome(best))}, ${cny(best.preco_yuan)}</small></div>`:"");
 if(best){const go=()=>{S.q=String(best.id);shown=PAGE;render();$("#list").scrollIntoView({behavior:"smooth"})};$("#bestk").onclick=go;$("#bestk").onkeydown=e=>{if(e.key=="Enter")go()}}

 $("#tabA").onclick=()=>tab(false);$("#tabD").onclick=()=>tab(true);

let LB=[],LBi=0;function openLb(f,n){LB=f;LBi=n;$("#lbi").src=f[n];$("#lbn").textContent=(n+1)+"/"+f.length;$("#lb").classList.add("open")}

 ["Vengeance RGB branco","Corsair, RGB e branco (白, white, 吹雪), 6000 ou 6400.",i=>i.marca=="Corsair"&&/白|white|branco|吹雪/i.test(i.modelo+" "+(i.titulo||""))&&i.rgb!="não"],
 ["Corsair com caixa","Corsair com caixa confirmada no texto ou na foto.",i=>i.marca=="Corsair"&&i.caixa_n=="com caixa"],
 ["CL30 ou CL32","Latência baixa, qualquer marca.",i=>i.cl&&i.cl<=32],
 ["7200 MHz ou mais","Kits mais rápidos.",i=>(i.velocidade||0)>=6800],
 ["Vendedor confiável e barato","Risco baixo e preço abaixo da mediana.",i=>i.vend_risco=="confiável"&&i.preco_yuan<=META.mediana]];
function drawPrio(){$("#prio").innerHTML=PRIO.map(([t,d,f],n)=>{const a=D.filter(i=>f(i)&&i.status=="à venda"&&(S.nv||i.verificado)).sort((x,y)=>x.preco_yuan-y.preco_yuan);
 return `<div class="pcard"><h3>${esc(t)}<span>${a.length} à venda</span></h3><p>${esc(d)}</p>${a.length?a.slice(0,4).map(i=>`<a class="pl" href="${esc(i.url)}" target="_blank" rel="noopener"><span>${esc(nome(i))}<br><small>${i.verificado?"verificado":"não verificado"}${i.score!=null?", score "+i.score:""}</small></span><b>${cny(i.preco_yuan)}<br><small>${brl(i.preco_brl)}</small></b></a>`).join("")+`<button class="ib" data-p="${n}">Ver ${a.length} no catálogo</button>`:`<p>Nenhum anúncio ${S.nv?"":"verificado "}nesta categoria agora.</p>`}</div>`}).join("");
 document.querySelectorAll("#prio [data-p]").forEach(b=>b.onclick=()=>{S.prio=+b.dataset.p;shown=PAGE;tab(false);render();$("#list").scrollIntoView({behavior:"smooth"})})}
function tab(d){$("#tabA").classList.toggle("on",!d);$("#tabD").classList.toggle("on",d);$("#list").hidden=d;$("#desc").hidden=!d;
 if(d){const A=META.descartados||[];$("#desc").innerHTML=`<div class="tw"><table><thead><tr><th>Anúncio</th><th>¥</th><th>Motivo</th><th></th></tr></thead><tbody>${A.map(a=>`<tr><td>${esc(a.titulo)}<div class="t">${esc(a.id)}</div></td><td>${cny(a.preco)}</td><td>${esc(a.motivo)}</td><td>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">Abrir</a>`:""}</td></tr>`).join("")}</tbody></table></div>`}}
function toggle(k,v){const a=S.f[k]=S.f[k]||[];const ix=a.indexOf(v);ix<0?a.push(v):a.splice(ix,1);if(!a.length)delete S.f[k];shown=PAGE;render(true)}
function filtered(){const q=S.q.toLowerCase();return D.filter(i=>(S.nv||i.verificado)&&(S.prio==null||PRIO[S.prio][2](i))&&Object.entries(S.f).every(([k,vs])=>vs.includes(String(i[k])))&&(!q||JSON.stringify(i).toLowerCase().includes(q))&&(i.preco_brl==null||i.preco_brl<=S.pmax))}
function sorted(a){const s=S.sort,d=s[0]=="-"?-1:1,k={preco:"preco_yuan",pgb:"preco_por_gb_brl",visto:"visto_em",vel:"velocidade",cl:"cl",score:"score",lucro:"lucro_brl"}[s.replace("-","")];return a.slice().sort((x,y)=>{let p=x[k],q=y[k];if(k=="cl"){p=parseFloat(p)||999;q=parseFloat(q)||999}if(p==null)return 1;if(q==null)return-1;return(p>q?1:p<q?-1:0)*d})}
function ago(t){if(!t)return null;const m=Math.round((Date.now()-new Date(t.replace(' ','T')+':00-03:00'))/60000);return m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'}
function badges(i){return[i.kit!="desconhecido"?i.kit:null,i.capacidade_gb?i.capacidade_gb+"GB":null,i.velocidade?i.velocidade+" MHz":null,i.cl?"CL"+i.cl:null,i.estado].filter(Boolean).map(b=>`<span class="bd">${esc(b)}</span>`).join("")+`<span class="bd ${i.caixa_n=="com caixa"?"g":""}">Caixa: ${esc(i.caixa_n)}</span><span class="bd">RGB: ${esc(i.rgb)}</span>`+(i.envio=="sim"?`<span class="bd g">Envia</span>`:`<span class="bd w">Envio não confirmado</span>`)+(i.verificado?`<span class="bd g">Verificado há ${ago(i.verificado_em)}</span>`:`<span class="bd w">Não verificado${i.verificado_em?" (há "+ago(i.verificado_em)+")":""}</span>`)+(i.cl_fonte=="foto"?`<span class="bd">CL pela foto</span>`:"")+(i.part_number?`<span class="bd">${esc(i.part_number)}</span>`:"")+(i.condicao_foto?`<span class="bd">Foto: ${esc(i.condicao_foto)}</span>`:"")+(i.status!="à venda"?`<span class="bd w">${esc(i.status)}</span>`:"")+(bestIds.has(i.id)?`<span class="bd g">Mais barato em ${i.velocidade} MHz${i.kit!="desconhecido"?" "+i.kit:""}</span>`:"")}
const nome=i=>i.titulo_pt||i.label;
function card(i,n){return `<div class="item ${bestIds.has(i.id)?"best":""}" >
 <div class="ph ${i.fotos&&i.fotos.length?"":"none"}" data-id="${esc(i.id)}">${i.fotos&&i.fotos.length?`<img loading="lazy" width="400" height="300" src="${esc(i.fotos[0])}" alt="">${i.fotos.length>1?`<span class="pn">${i.fotos.length} fotos</span>`:""}`:`<div class="noph">Sem foto</div>`}${i.cl?`<span class="clb">CL${i.cl}</span>`:""}</div>
 <div class="price">${brl(i.preco_brl)}<small>${cny(i.preco_yuan)}${i.preco_por_gb_brl?", "+brl(i.preco_por_gb_brl)+"/GB":""}${i.lucro_brl!=null?`. Lucro estimado ${brl(i.lucro_brl)} (${i.margem_pct}%)`:""}${i.score!=null?`. Score ${i.score}`:""}</small></div>
 <div><b>${esc(nome(i))}</b><div class="t">${esc(i.label)}${i.titulo?" · "+esc(i.titulo):""}</div></div><div class="badges">${badges(i)}</div>
 <details class="vend"><summary><span class="rk ${i.vend_risco=="confiável"?"ok":i.vend_risco=="atenção"?"md":"hi"}">${esc(i.vend_risco)}</span> ${esc(i.vend_nome||"vendedor ?")} · ${i.vend_vendas!=null?i.vend_vendas.toLocaleString("pt-BR")+" vendas":"vendas ?"}${i.vend_rating!=null?" · "+i.vend_rating+"%":""}</summary><ul>${(i.vend_motivos||[]).map(m=>`<li>${esc(m)}</li>`).join("")}</ul><div class="t">${i.vend_idade_dias!=null?"No Goofish há ~"+(i.vend_idade_dias>=365?Math.round(i.vend_idade_dias/365)+" anos":i.vend_idade_dias+" dias")+". ":""}${i.vend_local?"Local: "+esc(i.vend_local)+". ":""}${i.vend_perfil?`Perfil: ${i.vend_perfil.em_venda??"?"} à venda, ${i.vend_perfil.vendidos??"?"} vendidos, ${i.vend_perfil.avaliacoes??"?"} avaliações${i.vend_perfil.flags&&i.vend_perfil.flags.length?", "+esc(i.vend_perfil.flags.join(", ")):""}. `:""}Fonte: ${esc(i.vend_fonte)}.</div>${i.vend_url?`<a href="${esc(i.vend_url)}" target="_blank" rel="noopener">Ver perfil</a>`:""}</details>
 <div class="t">${esc(i.frete_local||"Local não informado")}. Visto em ${esc(i.visto_em)}</div>
 <a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Abrir no Goofish</a></div>`}
function render(soft){
 writeHash();$("#nv").checked=!!S.nv;if($("#q").value!==S.q)$("#q").value=S.q;$("#sort").value=S.sort;$("#pmax").value=S.pmax;$("#pmaxv").textContent=brl(+S.pmax);
 document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("on",(S.f[c.dataset.k]||[]).includes(c.dataset.v)));
 const act=Object.entries(S.f).flatMap(([k,vs])=>vs.map(v=>[k,v,fmtOf(k)(v)]));if(S.pmax<PMAX)act.push(["pmax","","até "+brl(+S.pmax)]);if(S.q)act.push(["q","","“"+S.q+"”"]);if(S.nv)act.push(["nv","","inclui não verificados"]);if(S.prio!=null&&PRIO[S.prio])act.push(["prio","",PRIO[S.prio][0]]);
 $("#active").innerHTML=act.map(([k,v,l])=>`<button class="chip rm" data-k="${k}" data-v="${esc(v)}" aria-label="Remover filtro">${esc(l)} ✕</button>`).join("");
 const n=act.length;$("#fcount").hidden=!n;$("#fcount").textContent=n;$("#openF").classList.toggle("on",n>0);
 const view=isMobile()?"cards":S.view;$("#vCards").classList.toggle("on",view=="cards");$("#vTable").classList.toggle("on",view=="table");
 const a=sorted(filtered());$("#count").textContent=`${a.length} anúncios${S.nv?"":" verificados"} (${D.filter(i=>i.verificado).length} de ${D.length} verificados nas últimas 12 h)`;$("#applyN").textContent=a.length;
 if(soft&&$("#sheet").classList.contains("open"))return;
 if(!a.length)$("#list").innerHTML=`<div class="empty">${S.nv?"Nada bate com esses filtros.":"Nenhum anúncio verificado bate com esses filtros. A verificação passa por todos os anúncios aos poucos; ative “mostrar não verificados” nos filtros para ver o resto."}<br><br><button class="ib" onclick="$('#clear').click()">Limpar filtros</button></div>`;
 else if(view=="cards")$("#list").innerHTML=`<div class="grid">${a.slice(0,shown).map(card).join("")}</div>`+(a.length>shown?`<button class="ib more" id="more">Carregar mais (${a.length-shown} restantes)</button>`:"");
 else $("#list").innerHTML=`<div class="tw"><table><thead><tr><th>Preço</th><th>¥</th><th>R$/GB</th><th>Anúncio</th><th>Specs</th><th>Local</th><th>Status</th><th>Visto</th><th></th></tr></thead><tbody>${a.map(i=>`<tr class="${bestIds.has(i.id)?"best":""}"><td><b>${brl(i.preco_brl)}</b></td><td>${cny(i.preco_yuan)}</td><td>${brl(i.preco_por_gb_brl)}</td><td>${esc(nome(i))}<div class="t">${esc(i.titulo)}</div></td><td><b>${i.cl?"CL"+i.cl:"CL?"}</b> · ${[i.kit,i.velocidade,"caixa: "+i.caixa_n,"RGB: "+i.rgb,"envio: "+i.envio].join(" · ")}</td><td class="t">${esc(i.frete_local)}<br>${esc(i.vend_nome||"?")} · <b>${esc(i.vend_risco)}</b></td><td>${esc(i.status)}</td><td class="t">${esc(i.visto_em)}</td><td><a href="${esc(i.url)}" target="_blank" rel="noopener">Abrir</a></td></tr>`).join("")}</tbody></table></div>`;
 document.querySelectorAll(".ph").forEach(p=>p.onclick=()=>{const i=D.find(x=>String(x.id)==p.dataset.id);if(i&&i.fotos&&i.fotos.length)openLb(i.fotos,0)});
 const m=$("#more");if(m)m.onclick=()=>{shown+=PAGE;render()};
 lastA=a;if($("#accCharts").open)drawCharts();
}
let lastA=[],resizeT;addEventListener("resize",()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>render(),200)});
function drawCharts(){const a=lastA;if(!window.Chart)return;const css=getComputedStyle(document.documentElement),acc=css.getPropertyValue("--acc").trim(),P=["#4f8cff","#2ecc71","#f5a623","#e74c3c","#9b59b6","#1abc9c"];
 Chart.defaults.color=css.getPropertyValue("--mut");Chart.defaults.borderColor=css.getPropertyValue("--bd");Object.values(charts).forEach(c=>c.destroy());
 const bins={};a.forEach(i=>{if(!i.preco_brl)return;const b=Math.floor(i.preco_brl/100)*100;bins[b]=(bins[b]||0)+1});const bk=Object.keys(bins).map(Number).sort((x,y)=>x-y);
 const o=t=>({maintainAspectRatio:false,animation:{duration:500},plugins:{title:{display:true,text:t},legend:{display:false}}});
 const BR=[...new Set(a.map(i=>i.marca))],yb=[2300,2400,2500,2600,2700,1e9],yl=["≤ ¥2.300","¥2.301–2.400","¥2.401–2.500","¥2.501–2.600","¥2.601–2.700","> ¥2.700"];
 const oc=o("Preço por marca (yuan)");oc.plugins.legend.display=true;oc.scales={x:{stacked:true},y:{stacked:true}};
 charts.c1=new Chart(c1,{type:"bar",data:{labels:yl,datasets:BR.map((b,n)=>({label:b,data:yb.map((h,k)=>a.filter(i=>i.marca==b&&i.preco_yuan<=h&&i.preco_yuan>(k?yb[k-1]:0)).length),backgroundColor:P[n%6]}))},options:oc});

 const o3=o("Preço × velocidade");o3.plugins.legend.display=true;o3.plugins.tooltip={callbacks:{label:c=>c.raw.l+": "+brl(c.raw.y)}};
 o3.plugins.title.text="Score × preço (¥)";o3.scales={x:{title:{display:true,text:"¥"}},y:{title:{display:true,text:"score"}}};o3.plugins.tooltip={callbacks:{label:c=>c.raw.l+": "+cny(c.raw.x)+", score "+c.raw.y}};
 charts.c3=new Chart(c3,{type:"scatter",data:{datasets:bn.map((b,n)=>({label:b,data:a.filter(i=>i.marca==b&&i.score!=null).map(i=>({x:i.preco_yuan,y:i.score,l:nome(i)})),backgroundColor:P[n%6]}))},options:o3});
}
