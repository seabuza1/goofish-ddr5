<!doctype html><html lang="pt-BR" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DDR5 no Goofish — Painel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1115;--card:#181b22;--fg:#e8eaf0;--mut:#8a90a2;--acc:#4f8cff;--ok:#2ecc71;--bd:#262a34;--warn:#f5a623}
[data-theme=light]{--bg:#f4f6fa;--card:#fff;--fg:#1b1e26;--mut:#667;--bd:#e2e5ec}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);transition:background .3s,color .3s}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;gap:10px;flex-wrap:wrap}h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:12px}
main{padding:0 24px 40px;max-width:1400px;margin:auto}
.btn{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}.btn:hover{border-color:var(--acc)}.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;animation:up .5s ease both}.stat b{font-size:22px;display:block}.stat small{color:var(--mut)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.row>span{color:var(--mut);font-size:12px;min-width:90px}
.chip{border:1px solid var(--bd);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;background:transparent;color:var(--fg);transition:all .15s}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
input[type=search],select{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:13px}input[type=search]{flex:1;min-width:200px}
input[type=range]{width:160px;accent-color:var(--acc)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}.charts .panel{height:260px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;animation:up .35s ease both;transition:transform .15s,border-color .15s}.item:hover{transform:translateY(-2px);border-color:var(--acc)}
.item.best{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}.price{font-size:24px;font-weight:700}.price small{font-size:13px;color:var(--mut);font-weight:400}
.badges{display:flex;flex-wrap:wrap;gap:4px}.bd{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--bd)}.bd.g{color:var(--ok);border-color:var(--ok)}.bd.w{color:var(--warn);border-color:var(--warn)}
.t{font-size:12px;color:var(--mut)}a.go{margin-top:auto;text-align:center;background:var(--acc);color:#fff;text-decoration:none;border-radius:8px;padding:8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--bd);text-align:left}th{cursor:pointer;color:var(--mut);position:sticky;top:0;background:var(--card)}tr.best td{background:rgba(46,204,113,.08)}a{color:var(--acc)}
.tw{overflow:auto;max-height:75vh}.empty{text-align:center;color:var(--mut);padding:40px}
@media(max-width:600px){main,header{padding-left:12px;padding-right:12px}.row>span{min-width:100%}}
</style></head><body>
<header><div><h1>🧠 Memórias DDR5 no Goofish</h1><div class="sub" id="meta">Carregando…</div></div>
<div><button class="btn" id="theme">🌓 Tema</button></div></header>
<main>
<div class="cards" id="cards"></div>
<div class="panel" id="filters">
 <div class="row"><input type="search" id="q" placeholder="🔎 Buscar (modelo, título, cidade, vendedor…)"><select id="sort">
  <option value="preco">Menor preço</option><option value="-preco">Maior preço</option><option value="pgb">Menor R$/GB</option><option value="-visto">Mais recente</option><option value="-vel">Maior velocidade</option><option value="cl">Menor latência (CL)</option></select>
  <button class="btn" id="vCards">▦ Cards</button><button class="btn" id="vTable">☰ Tabela</button><button class="btn" id="clear">✕ Limpar filtros</button></div>
 <div id="chips"></div>
 <div class="row"><span>Preço máx. (R$)</span><input type="range" id="pmax"><b id="pmaxv"></b></div>
 <div class="row"><span id="count"></span></div>
</div>
<div class="charts"><div class="panel"><canvas id="c1"></canvas></div><div class="panel"><canvas id="c2"></canvas></div><div class="panel"><canvas id="c3"></canvas></div></div>
<div id="list"></div>
</main>
<script>
const $=s=>document.querySelector(s),brl=n=>n==null?"—":n.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}),cny=n=>n==null?"—":"¥"+n.toLocaleString("pt-BR");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GROUPS=[["marca","Marca"],["capacidade_gb","Capacidade",v=>v?v+"GB":"?"],["kit","Kit"],["velocidade","Velocidade",v=>v?v+" MHz":"?"],["rgb","RGB"],["status","Status"]];
let D=[],META={},S={f:{},q:"",sort:"preco",view:"cards",pmax:null},charts={},bestIds=new Set();
const saved=localStorage.getItem("theme");if(saved)document.documentElement.dataset.theme=saved;
$("#theme").onclick=()=>{const t=document.documentElement.dataset.theme=="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("theme",t);drawCharts()};
function readHash(){try{const h=decodeURIComponent(location.hash.slice(1));if(h)Object.assign(S,JSON.parse(h))}catch(e){}}
function writeHash(){history.replaceState(null,"","#"+encodeURIComponent(JSON.stringify(S)))}
function countUp(el,to,fmt){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(to*e);if(p<1)requestAnimationFrame(f)})(t0)}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{META=d;D=d.items.filter(i=>i.preco_yuan!=null||true);init()}).catch(e=>{$("#meta").textContent="Erro ao carregar data.json: "+e});
function init(){
 $("#meta").textContent=`Atualizado em ${META.gerado_em} · ¥1 = R$ ${META.taxa_cny_brl.toFixed(4)} (${META.taxa_fonte}) · valores em R$ são conversão direta, sem impostos/frete`;
 // best deals: cheapest per (vel+kit) among à venda
 const g={};D.forEach(i=>{if(i.status!="à venda"||!i.preco_yuan)return;const k=i.velocidade+"|"+i.kit;if(!g[k]||i.preco_yuan<g[k].preco_yuan)g[k]=i});Object.values(g).forEach(i=>bestIds.add(i.id));
 const mx=Math.ceil(Math.max(...D.map(i=>i.preco_brl||0))/50)*50,mn=Math.floor(Math.min(...D.filter(i=>i.preco_brl).map(i=>i.preco_brl))/50)*50;
 Object.assign($("#pmax"),{min:mn,max:mx,step:10});readHash();if(!S.pmax)S.pmax=mx;
 $("#chips").innerHTML=GROUPS.map(([k,l,fm])=>{const vals=[...new Set(D.map(i=>i[k]))].sort((a,b)=>(a??0)>(b??0)?1:-1);return `<div class="row"><span>${l}</span>${vals.map(v=>`<button class="chip" data-k="${k}" data-v="${esc(v)}">${esc(fm?fm(v):v)} <small>(${D.filter(i=>i[k]==v).length})</small></button>`).join("")}</div>`}).join("");
 $("#chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const{k,v}=c.dataset;const a=S.f[k]=S.f[k]||[];const ix=a.indexOf(v);ix<0?a.push(v):a.splice(ix,1);if(!a.length)delete S.f[k];render()};
 $("#q").oninput=e=>{S.q=e.target.value;render()};$("#sort").onchange=e=>{S.sort=e.target.value;render()};
 $("#pmax").oninput=e=>{S.pmax=+e.target.value;render()};$("#vCards").onclick=()=>{S.view="cards";render()};$("#vTable").onclick=()=>{S.view="table";render()};
 $("#clear").onclick=()=>{S={f:{},q:"",sort:"preco",view:S.view,pmax:mx};render()};
 window.onhashchange=()=>{readHash();render()};
 const ps=D.map(i=>i.preco_yuan).filter(x=>x).sort((a,b)=>a-b),r=META.taxa_cny_brl,avg=ps.reduce((a,b)=>a+b,0)/ps.length,med=META.mediana;
 const st=[["Anúncios",D.length,n=>Math.round(n),`${D.filter(i=>i.status=="à venda").length} à venda`],["Mais barato",ps[0]*r,brl,cny(ps[0])],["Mediana",med*r,brl,cny(med)],["Média",avg*r,brl,cny(Math.round(avg))],["Mais caro",ps.at(-1)*r,brl,cny(ps.at(-1))]];
 $("#cards").innerHTML=st.map((s,i)=>`<div class="stat" style="animation-delay:${i*.07}s"><small>${s[0]}</small><b id="st${i}">0</b><small>${s[3]}</small></div>`).join("");st.forEach((s,i)=>countUp($("#st"+i),s[1],s[2]));
 render();
}
function filtered(){const q=S.q.toLowerCase();return D.filter(i=>Object.entries(S.f).every(([k,vs])=>vs.includes(String(i[k])))&&(!q||JSON.stringify(i).toLowerCase().includes(q))&&(i.preco_brl==null||i.preco_brl<=S.pmax))}
function sorted(a){const s=S.sort,d=s[0]=="-"?-1:1,k={preco:"preco_yuan",pgb:"preco_por_gb_brl",visto:"visto_em",vel:"velocidade",cl:"cl"}[s.replace("-","")];return a.slice().sort((x,y)=>{let p=x[k],q=y[k];if(k=="cl"){p=parseFloat(p)||999;q=parseFloat(q)||999}if(p==null)return 1;if(q==null)return-1;return(p>q?1:p<q?-1:0)*d})}
function badges(i){return[i.kit!="desconhecido"?i.kit:null,i.capacidade_gb?i.capacidade_gb+"GB":null,i.velocidade?i.velocidade+" MHz":null,i.cl?"CL"+i.cl:null,i.rgb=="sim"?"RGB":null,i.estado,i.caixa].filter(Boolean).map(b=>`<span class="bd">${esc(b)}</span>`).join("")+(i.status!="à venda"?`<span class="bd w">${esc(i.status)}</span>`:"")+(bestIds.has(i.id)?`<span class="bd g">★ melhor preço p/ ${i.velocidade} ${i.kit}</span>`:"")}
function render(){
 writeHash();$("#q").value=S.q;$("#sort").value=S.sort;$("#pmax").value=S.pmax;$("#pmaxv").textContent=brl(+S.pmax);
 document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",(S.f[c.dataset.k]||[]).includes(c.dataset.v)));
 $("#vCards").classList.toggle("on",S.view=="cards");$("#vTable").classList.toggle("on",S.view=="table");
 const a=sorted(filtered());$("#count").textContent=`${a.length} de ${D.length} anúncios`;
 if(!a.length){$("#list").innerHTML=`<div class="panel empty">Nenhum anúncio com esses filtros. <button class="btn" onclick="$('#clear').click()">Limpar filtros</button></div>`}
 else if(S.view=="cards")$("#list").innerHTML=`<div class="grid">${a.map((i,n)=>`<div class="item ${bestIds.has(i.id)?"best":""}" style="animation-delay:${Math.min(n,20)*.02}s">
  <div class="price">${brl(i.preco_brl)} <small>${cny(i.preco_yuan)}${i.preco_por_gb_brl?" · "+brl(i.preco_por_gb_brl)+"/GB":""}</small></div>
  <div><b>${esc(i.label)}</b>${i.titulo?`<div class="t">${esc(i.titulo)}</div>`:""}</div><div class="badges">${badges(i)}</div>
  <div class="t">📍 ${esc(i.frete_local||"local não informado")} · 👤 ${esc(i.vendas_vendedor||"—")}<br>🕒 visto em ${esc(i.visto_em)}</div>
  <a class="go" href="${esc(i.url)}" target="_blank" rel="noopener">Ver no Goofish ↗</a></div>`).join("")}</div>`;
 else $("#list").innerHTML=`<div class="panel tw"><table><thead><tr><th>Preço</th><th>¥</th><th>R$/GB</th><th>Anúncio</th><th>Specs</th><th>Local</th><th>Status</th><th>Visto</th><th></th></tr></thead><tbody>${a.map(i=>`<tr class="${bestIds.has(i.id)?"best":""}"><td><b>${brl(i.preco_brl)}</b></td><td>${cny(i.preco_yuan)}</td><td>${brl(i.preco_por_gb_brl)}</td><td>${esc(i.label)}<div class="t">${esc(i.titulo)}</div></td><td>${[i.kit,i.velocidade,i.cl&&"CL"+i.cl,i.rgb=="sim"&&"RGB"].filter(Boolean).join(" · ")}</td><td class="t">${esc(i.frete_local)}</td><td>${esc(i.status)}</td><td class="t">${esc(i.visto_em)}</td><td><a href="${esc(i.url)}" target="_blank" rel="noopener">Ver ↗</a></td></tr>`).join("")}</tbody></table></div>`;
 drawCharts(a);
}
let lastA=[];
function drawCharts(a){a=a||lastA;lastA=a;if(!window.Chart)return;const css=getComputedStyle(document.documentElement),fg=css.getPropertyValue("--mut"),acc=css.getPropertyValue("--acc").trim();
 Chart.defaults.color=fg;Chart.defaults.borderColor=css.getPropertyValue("--bd");Object.values(charts).forEach(c=>c.destroy());
 const ps=a.map(i=>i.preco_brl).filter(Boolean);const lo=Math.floor(Math.min(...ps,1e9)/100)*100,bins={};ps.forEach(p=>{const b=Math.floor(p/100)*100;bins[b]=(bins[b]||0)+1});const bk=Object.keys(bins).map(Number).sort((x,y)=>x-y);
 charts.c1=new Chart(c1,{type:"bar",data:{labels:bk.map(b=>"R$"+b),datasets:[{label:"Anúncios por faixa de preço",data:bk.map(b=>bins[b]),backgroundColor:acc,borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{title:{display:true,text:"Distribuição de preços (R$)"},legend:{display:false}}}});
 const br={};a.forEach(i=>{if(!i.preco_brl)return;(br[i.marca]=br[i.marca]||[]).push(i.preco_brl)});const bn=Object.keys(br);
 charts.c2=new Chart(c2,{type:"bar",data:{labels:bn,datasets:[{data:bn.map(b=>Math.round(br[b].reduce((x,y)=>x+y,0)/br[b].length)),backgroundColor:["#4f8cff","#2ecc71","#f5a623","#e74c3c","#9b59b6","#1abc9c"],borderRadius:6}]},options:{maintainAspectRatio:false,plugins:{title:{display:true,text:"Preço médio por marca (R$)"},legend:{display:false}}}});
 charts.c3=new Chart(c3,{type:"scatter",data:{datasets:bn.map((b,n)=>({label:b,data:a.filter(i=>i.marca==b&&i.velocidade&&i.preco_brl).map(i=>({x:i.velocidade,y:i.preco_brl,l:i.label})),backgroundColor:["#4f8cff","#2ecc71","#f5a623","#e74c3c","#9b59b6"][n%5]}))},options:{maintainAspectRatio:false,plugins:{title:{display:true,text:"Preço × velocidade"},tooltip:{callbacks:{label:c=>c.raw.l+": "+brl(c.raw.y)}}},scales:{x:{title:{display:true,text:"MHz"}},y:{title:{display:true,text:"R$"}}}}});
}
</script></body></html>
