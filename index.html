<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2">
<title>DDR5 no Goofish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f6f2;--card:#fff;--fg:#1d2320;--mut:#6b736f;--bd:#e6e3db;--acc:#0f5c57;--ok:#2f8a5b;--warn:#c48a12;--bad:#c0432f;--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overflow-x:hidden}
body{margin:0;font:15px/1.5 "Archivo",system-ui,sans-serif;background:var(--bg);color:var(--fg);font-variant-numeric:tabular-nums;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}[hidden]{display:none!important}
.wrap{max-width:1180px;margin:auto;padding:0 16px}
header{padding:18px 0 8px}header h1{font-size:15px;margin:0;font-weight:700}.line{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--bd);margin-top:10px}.tabs button{background:none;border:0;padding:10px 0;min-height:44px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}.tabs button.on{color:var(--fg);border-color:var(--acc)}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd)}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;align-items:center}.row::-webkit-scrollbar{display:none}
select,input[type=number],.btn{height:40px;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:0 10px;font-size:14px;flex:none}
select{padding-right:6px}input[type=number]{width:96px}
.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.btn.on{border-color:var(--acc);color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.n{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:9px;background:var(--acc);color:#fff;font-size:11px}
.presets{margin-top:8px}.presets .btn{height:34px;font-size:13px;border-radius:17px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 10px;font-size:14px;color:var(--mut)}
.best{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:14px}.best b{color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{flex:none;position:relative;overflow:hidden;aspect-ratio:4/3;background:#eeece6;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:600;line-height:1.3}.pr{font-size:24px;font-weight:700}.pr small{font-size:14px;font-weight:400;color:var(--mut);margin-left:6px}
.sp,.sl{font-size:14px;color:var(--mut)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.chip{font-size:14px;border:1px solid var(--bd);border-radius:6px;padding:2px 8px}.chip.ok{border-color:var(--ok);color:var(--ok)}
a.open{background:var(--acc);color:#fff;text-decoration:none;border-radius:8px;padding:0 18px;height:40px;display:inline-flex;align-items:center}
details.more{font-size:14px;color:var(--mut)}details.more summary{cursor:pointer;min-height:32px;display:flex;align-items:center}details.more ul{margin:4px 0;padding-left:18px}
.morebtn{display:block;margin:18px auto;width:100%;max-width:360px;justify-content:center}
.empty{text-align:center;color:var(--mut);padding:48px 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + var(--sab));max-height:80vh;overflow:auto}
@media(min-width:760px){.sheet{left:auto;top:0;width:380px;border-radius:0}}
.sheet h2{font-size:15px;margin:0 0 10px}.fg{margin:14px 0}.fg label{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}.fg .row{flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}.chk input{width:20px;height:20px;accent-color:var(--acc)}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}.sec h2{font-size:15px;margin:0 0 8px}
.sec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}.sec dt{color:var(--mut)}.sec dd{margin:0}
.sec ul{margin:0;padding-left:18px;font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}.tw{overflow-x:auto}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:#cfcabd}}
</style></head><body>
<div class="wrap">
<header><h1>DDR5 no Goofish</h1><div class="line" id="line">Carregando…</div>
<nav class="tabs" role="tablist"><button id="tC" class="on" role="tab">Catálogo</button><button id="tS" role="tab">Status</button></nav></header>
</div>
<section id="vC">
<div class="bar"><div class="wrap">
 <div class="row" id="fbar">
  <select id="fMarca" aria-label="Marca"><option value="">Marca</option></select>
  <select id="fFreq" aria-label="Frequência mínima"><option value="0">Frequência</option><option value="6000">6000+</option><option value="6400">6400+</option><option value="6800">6800+</option></select>
  <select id="fRgb" aria-label="RGB"><option value="">RGB</option><option value="sim">Com RGB</option><option value="não">Sem RGB</option></select>
  <select id="fCor" aria-label="Cor"><option value="">Cor</option><option value="branco">Branco</option><option value="preto">Preto</option></select>
  <select id="fPmax" aria-label="Preço máximo"><option value="">Preço máx.</option><option value="2300">até ¥2.300</option><option value="2500">até ¥2.500</option><option value="2700">até ¥2.700</option></select>
  <select id="fSort" aria-label="Ordenar"><option value="preco">Menor preço</option><option value="lucro">Maior lucro</option><option value="margem">Maior margem</option><option value="cl">Menor CL</option></select>
  <button class="btn" id="bMais">Mais filtros <span class="n" id="nMais" hidden>0</span></button>
  <button class="btn" id="bClear">Limpar</button>
 </div>
 <div class="row presets" id="presets"></div>
</div></div>
<div class="wrap">
 <div class="best" id="best" hidden></div>
 <div class="meta"><span id="count" aria-live="polite"></span></div>
 <div class="grid" id="grid"></div>
 <button class="btn morebtn" id="more" hidden></button>
</div>
</section>
<section id="vS" hidden><div class="wrap" id="status"></div></section>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Mais filtros" hidden>
 <h2>Mais filtros</h2>
 <div class="fg"><label>Margem de lucro (%)</label><div class="row"><input type="number" id="fMmin" placeholder="mín." inputmode="numeric" aria-label="Margem mínima"><input type="number" id="fMmax" placeholder="máx." inputmode="numeric" aria-label="Margem máxima"></div></div>
 <div class="fg"><label>CL máximo</label><div class="row"><select id="fCl"><option value="">Qualquer</option><option value="30">CL30</option><option value="32">até CL32</option><option value="36">até CL36</option><option value="40">até CL40</option></select></div></div>
 <div class="fg"><label>Caixa</label><div class="row"><select id="fCaixa"><option value="">Qualquer</option><option value="com caixa">Com caixa</option><option value="sem caixa">Sem caixa</option></select></div></div>
 <div class="fg"><label>Risco do vendedor</label><div class="row"><select id="fRisco"><option value="">Qualquer</option><option value="confiável">Só confiável</option><option value="nao-alto">Sem alto risco</option></select></div></div>
 <label class="chk"><input type="checkbox" id="fEnvio"> Só envio confirmado</label>
 <label class="chk"><input type="checkbox" id="fNv"> Incluir não verificados</label>
 <div class="row" style="margin-top:12px"><button class="btn pri" id="bOk">Ver resultados</button><button class="btn" id="bClear2">Limpar</button></div>
</div>
<script>
const $=s=>document.querySelector(s),cny=n=>n==null?"—":"¥"+Math.round(n).toLocaleString("pt-BR"),brl=n=>n==null?"—":"R$ "+Math.round(n).toLocaleString("pt-BR");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F0={marca:"",freq:0,rgb:"",cor:"",pmax:"",sort:"preco",mmin:"",mmax:"",cl:"",caixa:"",risco:"",envio:false,nv:false};
let D=[],META={},S={...F0},shown=24;
const PRE=[["RGB branco 6400+",{rgb:"sim",cor:"branco",freq:6400}],["Margem 20–30%",{mmin:20,mmax:30,sort:"margem"}],["Até ¥2.500",{pmax:"2500"}]];
function ago(t){if(!t)return"";const m=Math.round((Date.now()-new Date(t.replace(" ","T")+":00-03:00"))/6e4);return m<60?m+" min":m<1440?Math.round(m/60)+" h":Math.round(m/1440)+" d"}
function nome(i){let n=i.titulo_pt||i.label||i.modelo||"";return n.replace(/\b\d{2}GB\b|DDR5-\d{4}|\bCL\d{2}\b|\(.*?\)/gi,"").replace(/\s+/g," ").trim()}
// filtro puro (também usado nos testes)
function apply(D,S){const n=x=>x===""||x==null?null:+x;
 let a=D.filter(i=>(S.nv||i.verificado)&&i.status=="à venda"
  &&(!S.marca||i.marca==S.marca)&&(!+S.freq||(i.velocidade||0)>=+S.freq)&&(!S.rgb||i.rgb==S.rgb)&&(!S.cor||i.cor==S.cor)
  &&(n(S.pmax)==null||i.preco_yuan<=n(S.pmax))&&(n(S.mmin)==null||(i.margem_pct!=null&&i.margem_pct>=n(S.mmin)))&&(n(S.mmax)==null||(i.margem_pct!=null&&i.margem_pct<=n(S.mmax)))
  &&(!S.cl||(i.cl!=null&&i.cl<=+S.cl))&&(!S.caixa||i.caixa_n==S.caixa)&&(!S.risco||(S.risco=="confiável"?i.vend_risco=="confiável":i.vend_risco!="alto risco"))&&(!S.envio||i.envio=="sim"));
 const k={preco:[i=>i.preco_yuan,1],lucro:[i=>i.lucro_brl,-1],margem:[i=>i.margem_pct,-1],cl:[i=>i.cl,1]}[S.sort]||[i=>i.preco_yuan,1];
 return a.sort((x,y)=>{const p=k[0](x),q=k[0](y);if(p==null&&q==null)return x.preco_yuan-y.preco_yuan;if(p==null)return 1;if(q==null)return-1;return (p-q)*k[1]||x.preco_yuan-y.preco_yuan})}
window.__apply=st=>apply(D,{...F0,...st}).length;
const ctl={marca:"#fMarca",freq:"#fFreq",rgb:"#fRgb",cor:"#fCor",pmax:"#fPmax",sort:"#fSort",mmin:"#fMmin",mmax:"#fMmax",cl:"#fCl",caixa:"#fCaixa",risco:"#fRisco",envio:"#fEnvio",nv:"#fNv"};
function sync(){for(const[k,s]of Object.entries(ctl)){const e=$(s);if(e.type=="checkbox")e.checked=!!S[k];else e.value=S[k]??""}
 for(const[k,s]of Object.entries(ctl))$(s).classList&&$(s).classList.toggle("on",!!S[k]&&k!="sort"&&S[k]!=F0[k]);
 const nm=["mmin","mmax","cl","caixa","risco","envio","nv"].filter(k=>S[k]!==""&&S[k]!==false&&S[k]!=null).length;$("#nMais").hidden=!nm;$("#nMais").textContent=nm;$("#bMais").classList.toggle("on",nm>0)}
function save(){history.replaceState(null,"","#"+new URLSearchParams(Object.entries(S).filter(([k,v])=>v!==F0[k]&&v!=="").map(([k,v])=>[k,String(v)])))}
function load(){const p=new URLSearchParams(location.hash.slice(1));for(const[k,v]of p)if(k in F0)S[k]=typeof F0[k]=="boolean"?v=="true":typeof F0[k]=="number"?+v:v}
function card(i){const rk=i.vend_risco=="confiável"?"var(--ok)":i.vend_risco=="atenção"?"var(--warn)":"var(--bad)";
 const sp=[i.velocidade?i.velocidade+" MHz":null,i.cl?"CL"+i.cl:null,i.rgb=="sim"?"RGB":i.rgb=="não"?"sem RGB":null,i.cor!="desconhecida"?i.cor:null].filter(Boolean).join(" · ");
 const mg=i.margem_pct!=null?`<span class="chip ${i.margem_pct>=20&&i.margem_pct<=30?"ok":""}">margem ${Math.round(i.margem_pct)}%</span>`:`<span class="chip">margem ?</span>`;
 return `<article class="card"><div class="ph">${i.fotos&&i.fotos.length?`<img loading="lazy" width="400" height="300" src="${esc(i.fotos[0])}" alt="">`:"Sem foto"}</div><div class="cb">
 <div class="nm">${esc(nome(i))}</div><div class="pr">${cny(i.preco_yuan)}<small>${brl(i.preco_brl)}</small></div>
 <div class="sp">${esc(sp)||"specs não informadas"}</div>
 <div class="sl"><span class="dot" style="background:${rk}" title="${esc(i.vend_risco)}"></span>${esc(i.vend_nome||"vendedor ?")}${i.vend_vendas!=null?" · "+i.vend_vendas.toLocaleString("pt-BR")+" vendas":""}${i.vend_rating!=null?" · "+i.vend_rating+"%":""}</div>
 <details class="more"><summary>Detalhes</summary><ul>
  <li>${i.verificado?"Verificado há "+ago(i.verificado_em):"Não verificado"}</li><li>Kit ${esc(i.kit)}, caixa: ${esc(i.caixa_n)}, envio: ${esc(i.envio)}</li>
  ${i.lucro_brl!=null?`<li>Lucro estimado ${brl(i.lucro_brl)}</li>`:""}${i.titulo?`<li>${esc(i.titulo)}</li>`:""}${i.frete_local?`<li>${esc(i.frete_local)}</li>`:""}
  <li>Vendedor: ${esc(i.vend_risco)}. ${(i.vend_motivos||[]).map(esc).join("; ")}</li>${i.vend_url?`<li><a href="${esc(i.vend_url)}" target="_blank" rel="noopener">Perfil do vendedor</a></li>`:""}</ul></details>
 <div class="ft">${mg}<a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">Abrir</a></div></div></article>`}
function render(){sync();save();const a=apply(D,S);
 $("#count").textContent=`${a.length} ${a.length==1?"kit":"kits"}${S.nv?"":" verificados"}`;
 $("#grid").innerHTML=a.length?a.slice(0,shown).map(card).join(""):`<div class="empty">Nenhum kit com esses filtros. <button class="btn" onclick="clearAll()">Limpar</button></div>`;
 $("#more").hidden=a.length<=shown;$("#more").textContent=`Mostrar mais (${a.length-shown})`;
 const b=a.filter(i=>i.vend_risco!="alto risco").sort((x,y)=>x.preco_yuan-y.preco_yuan)[0];
 $("#best").hidden=!b;if(b)$("#best").innerHTML=`Melhor oferta com esses filtros: <b>${cny(b.preco_yuan)}</b> ${esc(nome(b))} · <a href="${esc(b.url)}" target="_blank" rel="noopener">abrir</a>`}
function clearAll(){S={...F0,sort:S.sort};shown=24;render()}
function sheet(o){$("#sheet").hidden=!o;$("#scrim").hidden=!o;document.body.style.overflow=o?"hidden":""}
function tab(s){$("#tC").classList.toggle("on",!s);$("#tS").classList.toggle("on",s);$("#vC").hidden=s;$("#vS").hidden=!s;if(s)status()}
function status(){const s=META.status||{},v=s.verificador||{},f=s.fotos||{},api=s.api_flatt||{},x=a=>a==null||a===""?"sem dados":esc(a);
 const dm=Object.entries(s.descartes_por_motivo||{}).sort((a,b)=>b[1]-a[1]),DS=META.descartados||[];
 $("#status").innerHTML=`<div class="sec"><h2>Atualização</h2><dl><dt>Dados</dt><dd>${x(META.gerado_em)}</dd><dt>Publicado</dt><dd>${x(s.ultimo_publish)}</dd><dt>Catálogo do bot</dt><dd>${x(s.catalogo_hermes_workspace)}</dd><dt>Câmbio</dt><dd>¥1 = R$ ${META.taxa_cny_brl?.toFixed(4)}</dd></dl></div>
 <div class="sec"><h2>Verificação ao vivo</h2><dl><dt>Estado</dt><dd>${x(v.estado)}${v.estado&&v.estado.startsWith("pausado")&&v.retoma_em?", retoma "+esc(v.retoma_em.slice(11)):""}</dd><dt>Última hora</dt><dd>${x(v.verificados_ultima_hora)} verificados, ${x(v.muros_ultima_hora)} bloqueios</dd><dt>Em 12 h</dt><dd>${v.total!=null?v.verificados_12h+" de "+v.total:"sem dados"}</dd></dl></div>
 <div class="sec"><h2>Fotos e traduções</h2><dl><dt>Fotos</dt><dd>${x(f.ok)} ok, ${x(f.falhas)} falhas</dd><dt>Traduções</dt><dd>${x((s.traducoes||{}).ok)}</dd><dt>API, último sucesso</dt><dd>${x(api.ultimo_sucesso)}</dd><dt>API, último erro</dt><dd>${x(api.ultimo_erro)}</dd></dl></div>
 <div class="sec"><h2>Regras</h2><ul><li>Só kits de 2 pentes, com envio, à venda.</li><li>Sem vendedores bloqueados.</li><li>Preço entre ¥1.200 e ¥5.000, sem preço por pente.</li><li>Por padrão, só verificados nas últimas 12 h.</li><li>Ponto verde, amarelo ou vermelho: risco do vendedor (confiável, atenção, alto).</li></ul></div>
 <details class="sec"><summary><b>Descartados (${DS.length})</b></summary><p>${dm.map(([k,n])=>esc(k)+": "+n).join(" · ")}</p><div class="tw"><table><tr><th>Anúncio</th><th>¥</th><th>Motivo</th></tr>${DS.map(a=>`<tr><td>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc((a.titulo||a.id).slice(0,60))}</a>`:esc(a.id)}</td><td>${cny(a.preco)}</td><td>${esc(a.motivo)}</td></tr>`).join("")}</table></div></details>`}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{META=d;D=d.items;
 const brands=[...new Set(D.map(i=>i.marca))].sort();$("#fMarca").innerHTML+=brands.map(b=>`<option>${esc(b)}</option>`).join("");
 $("#line").textContent=`${D.filter(i=>i.verificado&&i.status=="à venda").length} kits verificados · atualizado há ${ago(d.gerado_em)}`;
 $("#presets").innerHTML=PRE.map((p,n)=>`<button class="btn" data-p="${n}">${p[0]}</button>`).join("");
 $("#presets").onclick=e=>{const b=e.target.closest("[data-p]");if(!b)return;S={...F0,...PRE[+b.dataset.p][1]};shown=24;render()};
 for(const[k,s]of Object.entries(ctl)){const e=$(s);e.addEventListener(e.type=="number"?"input":"change",()=>{S[k]=e.type=="checkbox"?e.checked:(e.type=="number"&&e.value!==""?+e.value:e.value);shown=24;render()})}
 $("#bMais").onclick=()=>sheet(true);$("#bOk").onclick=$("#scrim").onclick=()=>sheet(false);$("#bClear").onclick=$("#bClear2").onclick=clearAll;
 $("#more").onclick=()=>{shown+=24;render()};$("#tC").onclick=()=>tab(false);$("#tS").onclick=()=>tab(true);
 addEventListener("keydown",e=>{if(e.key=="Escape")sheet(false)});
 load();render();window.__ready=true}).catch(e=>{$("#line").textContent="Falha ao carregar os dados: "+e});
</script></body></html>
